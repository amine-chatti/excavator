services:
  db:
    image: postgres:16-alpine
    container_name: excavator-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-excavator}
      POSTGRES_USER: ${POSTGRES_USER:-excavator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-excavator}
    ports:
      - "5432:5432"
    volumes:
      - excavator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-excavator} -d ${POSTGRES_DB:-excavator}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  excavator_postgres_data:
